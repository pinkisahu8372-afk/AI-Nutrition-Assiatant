<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriAI — Your Personal Nutrition Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
      background: #181b25;
      border-bottom: 1px solid #2a2d3a;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #f0f2f8; }
    header span { font-size: 12px; color: #6b7280; margin-left: 4px; }

    /* ── API Key Bar ── */
    #api-bar {
      background: #181b25;
      border-bottom: 1px solid #2a2d3a;
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #api-bar label { font-size: 13px; color: #9ca3af; white-space: nowrap; }
    #api-key-input {
      flex: 1;
      min-width: 220px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 7px 12px;
      color: #e8eaf0;
      font-size: 13px;
      outline: none;
      font-family: monospace;
    }
    #api-key-input:focus { border-color: #4ade80; }
    #api-key-input::placeholder { color: #4b5563; }
    #save-key-btn {
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #save-key-btn:hover { background: #16a34a; }
    #key-status { font-size: 12px; color: #4ade80; }

    /* ── Quick Actions ── */
    #quick-actions {
      display: flex;
      gap: 10px;
      padding: 16px 28px 0;
      flex-wrap: wrap;
    }
    .chip {
      background: #1e2130;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .chip:hover { background: #2a2d3a; color: #e8eaf0; border-color: #4ade80; }

    /* ── Chat Window ── */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }
    .avatar.bot { background: #14532d; color: #4ade80; }
    .avatar.user { background: #1e3a5f; color: #60a5fa; }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
    }
    .message.bot .bubble {
      background: #181b25;
      border: 1px solid #2a2d3a;
      border-top-left-radius: 4px;
      color: #d1d5db;
    }
    .message.user .bubble {
      background: #1a3a5c;
      border: 1px solid #1e4976;
      border-top-right-radius: 4px;
      color: #e8eaf0;
    }

    /* Markdown-ish styles inside bubble */
    .bubble strong { color: #f0f2f8; }
    .bubble em { color: #9ca3af; }
    .bubble ul, .bubble ol { padding-left: 18px; margin-top: 6px; }
    .bubble li { margin-bottom: 3px; }
    .bubble table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    .bubble th { background: #1e2130; color: #9ca3af; padding: 6px 10px; text-align: left; border: 1px solid #2a2d3a; }
    .bubble td { padding: 6px 10px; border: 1px solid #2a2d3a; color: #d1d5db; }
    .bubble tr:nth-child(even) td { background: #181b25; }
    .bubble code { background: #0f1117; border-radius: 4px; padding: 1px 5px; font-size: 12px; color: #86efac; }
    .bubble pre { background: #0f1117; border-radius: 8px; padding: 10px; overflow-x: auto; margin-top: 8px; }
    .bubble pre code { background: none; padding: 0; }

    /* Typing indicator */
    .typing-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

    /* ── Input Bar ── */
    #input-bar {
      border-top: 1px solid #2a2d3a;
      background: #181b25;
      padding: 16px 28px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    /* full-width wrapper */
    #input-wrapper {
      background: #181b25;
      border-top: 1px solid #2a2d3a;
      padding: 0;
    }
    #user-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 11px 14px;
      color: #e8eaf0;
      font-size: 14px;
      resize: none;
      max-height: 140px;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
    }
    #user-input:focus { border-color: #4ade80; }
    #user-input::placeholder { color: #4b5563; }

    #send-btn {
      background: #22c55e;
      border: none;
      border-radius: 12px;
      width: 44px; height: 44px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #16a34a; }
    #send-btn:disabled { background: #374151; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: #000; }

    /* ── Welcome card ── */
    #welcome {
      text-align: center;
      padding: 40px 20px;
    }
    #welcome .icon { font-size: 52px; margin-bottom: 12px; }
    #welcome h2 { font-size: 24px; font-weight: 700; color: #f0f2f8; margin-bottom: 8px; }
    #welcome p { color: #6b7280; font-size: 14px; max-width: 420px; margin: 0 auto; line-height: 1.6; }

    /* scrollbar */
    #chat-container::-webkit-scrollbar { width: 6px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🥦</div>
  <h1>NutriAI</h1>
  <span>Powered by Groq</span>
</header>

<!-- API Key Bar -->
<div id="api-bar">
  <label for="api-key-input">Groq API Key:</label>
  <input id="api-key-input" type="password" placeholder="gsk_..." autocomplete="off" />
  <button id="save-key-btn">Save</button>
  <span id="key-status"></span>
</div>

<!-- Quick Prompts -->
<div id="quick-actions">
  <div class="chip" onclick="sendQuick('What should I eat for breakfast to boost energy?')">⚡ Breakfast ideas</div>
  <div class="chip" onclick="sendQuick('Give me a 1500-calorie meal plan for today.')">📋 Meal plan</div>
  <div class="chip" onclick="sendQuick('What are high-protein foods for muscle gain?')">💪 High protein</div>
  <div class="chip" onclick="sendQuick('What vitamins am I likely missing on a vegan diet?')">🌱 Vegan tips</div>
  <div class="chip" onclick="sendQuick('How much water should I drink daily?')">💧 Hydration</div>
  <div class="chip" onclick="sendQuick('Explain macros: protein, carbs, and fat.')">📊 Macros 101</div>
</div>

<!-- Chat -->
<div id="chat-container">
  <div id="welcome">
    <div class="icon">🥗</div>
    <h2>Your Personal Nutrition Agent</h2>
    <p>Ask me anything about food, calories, meal planning, vitamins, weight goals, or healthy eating. Save your Groq API key above to get started.</p>
  </div>
</div>

<!-- Input -->
<div id="input-wrapper">
  <div id="input-bar">
    <textarea id="user-input" rows="1" placeholder="Ask about nutrition, meal plans, calories…"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────
  let groqApiKey = localStorage.getItem('groq_api_key') || '';
  const conversationHistory = [];

  const SYSTEM_PROMPT = `You are NutriAI, an expert nutrition agent. You provide evidence-based, practical advice on:
- Meal planning and healthy recipes
- Calorie counting and macronutrient breakdowns
- Vitamins, minerals, and supplements
- Weight management (loss, gain, maintenance)
- Dietary needs for specific goals (muscle gain, energy, sleep, etc.)
- Special diets: vegan, keto, paleo, Mediterranean, gluten-free, etc.
- Food labels and ingredient analysis

When giving meal plans or food lists, use clear tables or bullet points.
Always mention portion sizes and approximate calories when relevant.
Be encouraging, practical, and scientific. Avoid medical diagnoses — recommend consulting a doctor for health conditions.
Keep answers concise but thorough.`;

  // ── API Key ─────────────────────────────────────────────
  const apiKeyInput = document.getElementById('api-key-input');
  const saveKeyBtn  = document.getElementById('save-key-btn');
  const keyStatus   = document.getElementById('key-status');

  if (groqApiKey) {
    apiKeyInput.value = groqApiKey;
    keyStatus.textContent = '✓ Key loaded';
  }

  saveKeyBtn.addEventListener('click', () => {
    const val = apiKeyInput.value.trim();
    if (!val) { keyStatus.style.color = '#f87171'; keyStatus.textContent = 'Enter a key first.'; return; }
    groqApiKey = val;
    localStorage.setItem('groq_api_key', val);
    keyStatus.style.color = '#4ade80';
    keyStatus.textContent = '✓ Saved!';
    setTimeout(() => { keyStatus.textContent = ''; }, 3000);
  });

  // ── Chat helpers ────────────────────────────────────────
  const chatContainer = document.getElementById('chat-container');
  const userInput     = document.getElementById('user-input');
  const sendBtn       = document.getElementById('send-btn');

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function addMessage(role, content) {
    removeWelcome();
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? '🥦' : 'U';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(content);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    removeWelcome();
    const msg = document.createElement('div');
    msg.className = 'message bot';
    msg.id = 'typing-msg';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = '🥦';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-dots';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function removeTypingIndicator() {
    const t = document.getElementById('typing-msg');
    if (t) t.remove();
  }

  // ── Simple Markdown renderer ────────────────────────────
  function renderMarkdown(text) {
    // Escape HTML first
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Code blocks
    html = html.replace(/```[\s\S]*?```/g, m => {
      const code = m.slice(3, -3).replace(/^\w+\n/, '');
      return `<pre><code>${code}</code></pre>`;
    });

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

    // Italic
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/_(.+?)_/g, '<em>$1</em>');

    // Markdown tables
    html = html.replace(/(\|.+\|\n)(\|[-| :]+\|\n)((?:\|.+\|\n?)*)/g, (_, header, sep, body) => {
      const ths = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      const rows = body.trim().split('\n').map(row => {
        const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
        return `<tr>${tds}</tr>`;
      }).join('');
      return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
    });

    // Headings
    html = html.replace(/^### (.+)$/gm, '<h4 style="color:#f0f2f8;margin:10px 0 4px">$1</h4>');
    html = html.replace(/^## (.+)$/gm,  '<h3 style="color:#f0f2f8;margin:12px 0 6px">$1</h3>');
    html = html.replace(/^# (.+)$/gm,   '<h2 style="color:#f0f2f8;margin:14px 0 8px">$1</h2>');

    // Unordered lists
    html = html.replace(/((?:^- .+\n?)+)/gm, m => {
      const items = m.trim().split('\n').map(l => `<li>${l.slice(2)}</li>`).join('');
      return `<ul>${items}</ul>`;
    });

    // Ordered lists
    html = html.replace(/((?:^\d+\. .+\n?)+)/gm, m => {
      const items = m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
      return `<ol>${items}</ol>`;
    });

    // Line breaks
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  // ── Groq API call (streaming) ───────────────────────────
  async function callGroq(userMessage) {
    if (!groqApiKey) {
      addMessage('bot', '⚠️ Please enter your **Groq API key** in the bar above and click **Save**.');
      return;
    }

    conversationHistory.push({ role: 'user', content: userMessage });

    addTypingIndicator();
    sendBtn.disabled = true;

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${groqApiKey}`
        },
        body: JSON.stringify({
          model: 'llama3-8b-8192',
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            ...conversationHistory
          ],
          temperature: 0.7,
          max_tokens: 1024,
          stream: true
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      removeTypingIndicator();
      const bubble = addMessage('bot', '').querySelector
        ? addMessage('bot', '') : (() => { removeWelcome(); return addMessage('bot', ''); })();

      // Actually get the bubble element just added
      const allBubbles = chatContainer.querySelectorAll('.message.bot .bubble');
      const streamBubble = allBubbles[allBubbles.length - 1];
      let fullText = '';

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

        for (const line of lines) {
          const data = line.slice(6);
          if (data === '[DONE]') break;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            fullText += delta;
            streamBubble.innerHTML = renderMarkdown(fullText);
            chatContainer.scrollTop = chatContainer.scrollHeight;
          } catch (_) {}
        }
      }

      conversationHistory.push({ role: 'assistant', content: fullText });

    } catch (err) {
      removeTypingIndicator();
      addMessage('bot', `❌ **Error:** ${err.message}\n\nPlease check your API key or network connection.`);
    } finally {
      sendBtn.disabled = false;
    }
  }

  // ── Send handler ────────────────────────────────────────
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    userInput.value = '';
    userInput.style.height = 'auto';
    addMessage('user', text);
    await callGroq(text);
  }

  function sendQuick(text) {
    userInput.value = text;
    sendMessage();
  }

  sendBtn.addEventListener('click', sendMessage);

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });
</script>

</body>
</html>
